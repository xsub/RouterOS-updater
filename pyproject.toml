[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "routeros-updater"
version = "0.1.1"
description = "Resumable, externally verified RouterOS and RouterBOOT updates over pinned SSH"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["paramiko>=5.1.0,<6"]

[project.urls]
Repository = "https://github.com/xsub/RouterOS-updater"
Issues = "https://github.com/xsub/RouterOS-updater/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.11", "pip-audit>=2.9", "build>=1.2"]

[project.scripts]
routeros-updater = "routeros_updater.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S104", "S105", "S106", "S108", "S311"]
